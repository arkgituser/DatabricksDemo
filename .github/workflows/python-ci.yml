name: Python CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pytest

      - name: Run Unit Tests
        run: |
          pytest

      - name: Validate Databricks Files
        run: |
          test -f databricks.yml
          test -f notebooks/customer_load.py

      - name: Success Message
        run: |
          echo "CI Pipeline completed successfully"